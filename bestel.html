<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Menu - Onze stand</title>

  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="kop-klein">
  <a class="terug" href="index.html">Terug</a>
  <h1>Menu</h1>
</header>

<main class="inhoud">

  <article class="product">
    <div class="beeld beeld-vak">Foto</div>
    <div class="product-tekst">
      <div class="product-top">
        <h3>Roomijs vanille</h3>
        <p class="prijs">&euro; 3,00</p>
      </div>
      <p class="product-omschrijving">Romig vanille-ijs in een hoorntje.</p>
      <p class="product-allergenen">Bevat melk</p>
    </div>
    <div class="teller">
      <button class="tel-knop" type="button">-</button>
      <span class="tel-getal">1</span>
      <button class="tel-knop" type="button">+</button>
    </div>
  </article>

</main>

<script src="assets/js/script.js"></script>

</body>
</html>
